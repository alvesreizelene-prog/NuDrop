
name: NuDrop

options:
  bundleIdPrefix: com.teste

targets:
  NuDrop:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - NuDropApp.swift
      - ContentView.swift
      - Assets.xcassets
    resources:
      - path: Resources/logo.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teste.nudrop
        PRODUCT_NAME: NuDrop
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

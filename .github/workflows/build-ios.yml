name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Verificar projeto
        run: ls -la NuDrop.xcodeproj

      - name: Compilar aplicativo
        run: |
          xcodebuild \
            -project NuDrop.xcodeproj \
            -scheme NuDrop \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            build

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NuDrop.app Payload/
          /usr/bin/zip -r NuDrop-unsigned.ipa Payload

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuDrop-unsigned-ipa
          path: NuDrop-unsigned.ipa

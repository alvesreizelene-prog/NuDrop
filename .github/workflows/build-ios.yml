```yaml
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Conferir arquivos
        run: |
          pwd
          ls -la
          cat project.yml

      - name: Gerar projeto Xcode
        run: |
          xcodegen generate
          ls -la
          test -d NuDrop.xcodeproj

      - name: Compilar aplicativo
        run: |
          xcodebuild \
            -project NuDrop.xcodeproj \
            -scheme NuDrop \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NuDrop.app Payload/
          /usr/bin/zip -r NuDrop-unsigned.ipa Payload

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuDrop-unsigned-ipa
          path: NuDrop-unsigned.ipa
```

name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Verificar projeto
        run: ls -la NuDrop.xcodeproj

      - name: Compilar aplicativo
        run: |
          xcodebuild \
            -project NuDrop.xcodeproj \
            -scheme NuDrop \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            build



      - name: Verificar ícone compilado
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/NuDrop.app"

          echo "=== Informações do ícone no Info.plist ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIcons' \
            "$APP_PATH/Info.plist" || true

          echo "=== Recursos de ícone em Assets.car ==="
          xcrun assetutil --info "$APP_PATH/Assets.car" 2>/dev/null \
            | grep -i -E 'AppIcon|IconName|Icon' \
            | head -80 || true



      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NuDrop.app Payload/
          /usr/bin/zip -r NuDrop-unsigned.ipa Payload

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuDrop-unsigned-ipa
          path: NuDrop-unsigned.ipa
